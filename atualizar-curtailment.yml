name: Atualizar bases de curtailment

on:
  schedule:
    - cron: '17 9 * * 1' # Segunda-feira, 09:17 UTC (06:17 Brasília).
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Carga 2024–2026: mês inicial YYYY-MM (vazio = atualização recente)'
        required: false
        type: string
      fim:
        description: 'Carga 2024–2026: mês final YYYY-MM (preencher junto com início)'
        required: false
        type: string
      fontes:
        description: 'Fontes da carga manual (disponibilidade pode diferir)'
        required: true
        default: 'EOL UFV'
        type: choice
        options:
          - 'EOL UFV'
          - EOL
          - UFV

permissions:
  contents: write

concurrency:
  group: atualizar-curtailment
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-coleta.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-coleta.txt pytest==8.3.5
      - name: Testar coletor
        run: python -m pytest tests/test_atualizar_curtailment.py -q
      - name: Coletar e validar
        env:
          MES_INICIAL: ${{ inputs.inicio }}
          MES_FINAL: ${{ inputs.fim }}
          FONTES: ${{ inputs.fontes }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--meses-fechados 3 --incluir-atual)
          if [[ -n "$MES_INICIAL" || -n "$MES_FINAL" ]]; then
            args=(--inicio "$MES_INICIAL" --fim "$MES_FINAL")
          fi
          case "${FONTES:-EOL UFV}" in
            'EOL UFV') fontes=(EOL UFV) ;;
            EOL) fontes=(EOL) ;;
            UFV) fontes=(UFV) ;;
            *) echo 'Seleção de fontes inválida' >&2; exit 1 ;;
          esac
          python scripts/atualizar_curtailment.py "${args[@]}" --fontes "${fontes[@]}"
      - name: Publicar somente após sucesso de toda a coleta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curtailment
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: atualizar snapshot mensal de curtailment"
          # Sem force-push: se o remoto avançar, falha com segurança e exige nova execução.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
