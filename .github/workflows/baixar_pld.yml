name: Baixar PLD da CCEE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baixar-pld:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estrutura
        run: |
          echo "Diretório atual:"
          pwd
          echo "Conteúdo da pasta pld-ccee:"
          find pld-ccee -maxdepth 4 -type f | sort

      - name: Executar download dos arquivos da CCEE
        run: |
          python pld-ccee/scripts/baixar_pld.py

      - name: Publicar arquivos como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pld-ccee
          path: pld-ccee/dados/*.csv
          if-no-files-found: warn
          retention-days: 30
