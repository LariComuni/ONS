name: Atualizar bases EVT

on:
  schedule:
    - cron: '43 9 * * 1' # Segunda-feira, 06:43 Brasília.
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Mês inicial YYYY-MM, somente 2024–2026 (vazio = recente)'
        required: false
        type: string
      fim:
        description: 'Mês final YYYY-MM (preencher junto com início)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atualizar-evt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-evt.txt
      - name: Instalar dependências EVT
        run: python -m pip install -r requirements-evt.txt pytest==8.3.5
      - name: Testar coletor EVT
        run: python -m pytest tests/test_atualizar_evt.py -q
      - name: Coletar e validar EVT
        env:
          MES_INICIAL: ${{ inputs.inicio }}
          MES_FINAL: ${{ inputs.fim }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--meses-fechados 3 --incluir-atual)
          if [[ -n "$MES_INICIAL" || -n "$MES_FINAL" ]]; then
            args=(--inicio "$MES_INICIAL" --fim "$MES_FINAL")
          fi
          python scripts/atualizar_evt.py "${args[@]}"
      - name: Publicar snapshot EVT validado
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: atualizar snapshot mensal EVT"
          git push origin "HEAD:${TARGET_BRANCH}"
